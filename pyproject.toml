[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "logos-pkpd"
version = "0.5.0"
description = "Reproducible dimensionless LOGOS whole-regimen PK/PD benchmarks with synthetic data"
readme = "README.md"
authors = [{name = "Vangelis D. Karalis"}]
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["logos", "pharmacokinetics", "pharmacodynamics", "pkpd", "dose-optimization", "dosing-regimens", "mathematical-modeling", "computational-pharmacology", "model-informed-precision-dosing", "treatment-optimization", "drug-safety"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "Topic :: Scientific/Engineering"]
dependencies = ["numpy==2.3.5", "scipy==1.17.1", "matplotlib==3.10.9"]

[project.scripts]
logos-pkpd = "logos_pkpd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/vkaralis/LOGOS-theory-general"
